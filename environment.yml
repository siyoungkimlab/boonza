# boonza with OpenMM and AmberTools (GAFF2 ligands), from conda-forge:
#   conda env create -f environment.yml && conda activate boonza && pip install -e . --no-deps
# install.sh does the same, pins OpenMM's CUDA release or version on request, and
# adds the optional OpenFF ligand force fields with --openff (bash install.sh --help).
name: boonza
channels:
  - conda-forge
dependencies:
  - python=3.12
  # 2.4 and later need x86-64-v2 CPUs, which older HPC nodes lack
  - numpy>=2.0,<2.4
  - numba
  - rdkit
  - openmm>=8.2
  - pandas<3
  - networkx
  - ambertools
  - matplotlib
  # only so the Python tools bundled with AmberTools find what they declare
  - netcdf4
  - pdb2pqr
  - requests
  - pip
  # Optional: OpenFF ligand force fields (ligandff = "openff-2.2.1") and NAGL charges.
  # GAFF2, the default, needs none of them, and they bring PyTorch (about 60
  # packages, 150 MB).  Uncomment, or run: bash install.sh --openff
  # - openmmforcefields
  # - openff-forcefields
  # - openff-nagl
  # - openff-nagl-models
