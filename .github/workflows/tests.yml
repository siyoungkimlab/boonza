name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ruff
      - name: Lint
        run: ruff check src tests benchmarks docs examples
      - name: Formatting
        run: ruff format --check src tests benchmarks docs examples

  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # the oldest supported Python and the newest
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the package with all its dependencies, plus pytest, ruff and the
          # MDAnalysis reference
          python -m pip install -e '.[dev]'
      - name: Report the environment under test
        run: |
          python -c "import numpy, numba; print('numpy', numpy.__version__, 'numba', numba.__version__)"
          python -c "import rdkit, openmm, MDAnalysis; print('rdkit', rdkit.__version__, 'openmm', openmm.version.version, 'MDAnalysis', MDAnalysis.__version__)"
      - name: Run tests
        # msys, mdtraj, gemmi and ChimeraX oracles and the MDAnalysis test data
        # are not installed here; those tests skip themselves
        run: pytest tests -q -rs

  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r docs/requirements.txt
      - name: Build docs as strictly as Read the Docs should
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

  # One stable context for branch protection to require. Matrix job names
  # change whenever the matrix does; this one does not.
  all-checks:
    name: all checks
    if: always()
    needs: [lint, tests, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "lint:  ${{ needs.lint.result }}"
          echo "tests: ${{ needs.tests.result }}"
          echo "docs:  ${{ needs.docs.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.tests.result }}" = "success" ] \
            && [ "${{ needs.docs.result }}" = "success" ]
