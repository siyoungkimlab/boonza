[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boonza"
dynamic = ["version"]
description = "A molecular reader, editor and writer that helps humans and AI understand how atoms and molecules are arranged in space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "numba>=0.59"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
chem = ["rdkit"]
openmm = ["openmm"]
trajectories = ["MDAnalysis"]

[project.scripts]
boonza = "boonza.cli:main"

[tool.setuptools.dynamic]
version = { attr = "boonza.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
