site_name: boonza
site_description: A molecular reader, editor and writer that helps humans and AI understand how atoms and molecules are arranged in space
repo_url: https://github.com/siyoungkimlab/boonza
repo_name: siyoungkimlab/boonza
docs_dir: docs
# the scripts that generate reference.md and examples.md are not pages
exclude_docs: |
  gen_*.py
  requirements.txt
nav:
  - Home: index.md
  - Examples: examples.md
  - Guide:
      - Systems: guide/systems.md
      - Selections: guide/selections.md
      - Files and trajectories: guide/io.md
      - Force fields: guide/forcefield.md
      - Building systems: guide/building.md
      - Checking systems: guide/checking.md
      - Geometry and PBC: guide/geometry.md
      - Alignment: guide/alignment.md
      - Analysis: guide/analysis.md
      - Summaries for AI: guide/summaries.md
      - RDKit and OpenMM: guide/bridges.md
      - Command line: guide/cli.md
  - API reference: reference.md
  - Verification: verification.md

theme:
  name: material
  palette:
    # dark by default; the toggle switches to light
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
